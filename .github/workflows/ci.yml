name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements-windows-py313.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-windows-py313.lock
      - name: Run tests
        env:
          TEMPORAL_GUARD_ALLOW_MODEL_DOWNLOAD: "0"
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build